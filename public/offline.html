<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mode hors ligne - Le Royaume Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #050816 0%, #0f0d2e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      color: #d4af37;
    }

    p {
      font-size: 16px;
      color: #b0b0b0;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .tip {
      background: rgba(212, 175, 55, 0.1);
      border-left: 4px solid #d4af37;
      padding: 16px;
      margin-top: 32px;
      text-align: left;
      border-radius: 4px;
    }

    .tip-title {
      font-weight: 600;
      color: #d4af37;
      margin-bottom: 8px;
    }

    .tip-text {
      font-size: 14px;
      color: #b0b0b0;
    }

    button {
      margin-top: 32px;
      padding: 12px 32px;
      background: #d4af37;
      color: #050816;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #e8c547;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Mode hors ligne</h1>
    <p>Vous n'êtes pas connecté à Internet en ce moment.</p>
    <p>Reconnectez-vous pour continuer à explorer Le Royaume Connect.</p>

    <div class="tip">
      <div class="tip-title">💡 Conseil</div>
      <div class="tip-text">
        Certains contenus que vous aviez consultés précédemment pourraient être disponibles en cache.
      </div>
    </div>

    <button onclick="location.reload()">
      Réessayer la connexion
    </button>
  </div>

  <script>
    // Check for connection restoration
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
